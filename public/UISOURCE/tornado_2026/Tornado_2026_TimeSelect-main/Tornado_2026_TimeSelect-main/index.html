<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Woolink | 話せる時間を選ぶ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="phone">

  <header class="topbar">
    <div class="brand">
      <img class="brand-logo" src="picture/woolinkロゴ.svg" alt="Woolink">
    </div>
    <button class="menu-btn" id="menuBtn" aria-label="メニューを開く" aria-expanded="false" aria-controls="menuPanel">
      <span></span><span></span><span></span>
    </button>
  </header>

  <nav class="menu-panel" id="menuPanel" hidden>
    <a class="menu-item" href="placeholder.html?title=プロフィール">
      <span>プロフィール</span><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="menu-item" href="placeholder.html?title=お知らせ">
      <span>お知らせ</span><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="menu-item" href="placeholder.html?title=設定">
      <span>設定</span><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="menu-item" href="placeholder.html?title=ヘルプ">
      <span>ヘルプ</span><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="menu-item" href="placeholder.html?title=ログアウト">
      <span>ログアウト</span><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </nav>

  <main class="content">
    <div class="scroll-area">

      <div class="selected-contact">
        <span class="avatar avatar-5">
          <svg viewBox="0 0 40 40" width="22" height="22"><circle cx="20" cy="15" r="7" fill="#eef0fb"/><path d="M6 34c0-8 6-13 14-13s14 5 14 13" fill="none" stroke="#eef0fb" stroke-width="3" stroke-linecap="round"/></svg>
        </span>
        <span class="contact-main">
          <span class="contact-name">Sora</span>
          <span class="contact-tag">🌙 サンプル</span>
        </span>
        <span class="radio-dot is-checked" aria-hidden="true"></span>
      </div>

      <div class="picker-header">
        <span class="picker-title">話せる時間を選ぶ</span>
        <span class="picker-status" id="pickerStatus">未選択</span>
      </div>

      <div class="time-grid" id="timeGrid"></div>

    </div>

    <div class="footer-actions">
      <a class="next-btn" id="nextBtn" href="placeholder.html?title=次へ">次へ</a>

      <div class="back-btn-wrap">
        <button class="back-btn" id="backBtn">
          <svg viewBox="0 0 24 24" width="14" height="14"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          戻る
        </button>
      </div>
    </div>
  </main>

</div>

<script>
  /* ---------- 戻るボタン ---------- */
  document.getElementById('backBtn').addEventListener('click', () => {
    if (window.history.length > 1) {
      window.history.back();
    }
  });

  /* ---------- ハンバーガーメニュー ---------- */
  const menuBtn = document.getElementById('menuBtn');
  const menuPanel = document.getElementById('menuPanel');

  menuBtn.addEventListener('click', () => {
    const isOpen = !menuPanel.hidden;
    menuPanel.hidden = isOpen;
    menuBtn.classList.toggle('open', !isOpen);
    menuBtn.setAttribute('aria-expanded', String(!isOpen));
  });

  document.addEventListener('click', (e) => {
    if (!menuPanel.hidden && !menuPanel.contains(e.target) && !menuBtn.contains(e.target)) {
      menuPanel.hidden = true;
      menuBtn.classList.remove('open');
      menuBtn.setAttribute('aria-expanded', 'false');
    }
  });

  /* ---------- 時間帯グリッド（30分単位、20:00〜26:00） ---------- */
  const START_HOUR = 20;
  const END_HOUR = 26; // 26:00 = 翌 2:00 として表示
  const timeGrid = document.getElementById('timeGrid');
  const pickerStatus = document.getElementById('pickerStatus');

  function formatHour(h) {
    return String(h % 24).padStart(2, '0');
  }

  const slots = [];
  for (let h = START_HOUR; h < END_HOUR; h++) {
    for (let half = 0; half < 2; half++) {
      const label = half === 0 ? formatHour(h) + ':00' : '';
      const cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'time-row';
      cell.dataset.index = slots.length;

      const labelSpan = document.createElement('span');
      labelSpan.className = 'time-label';
      labelSpan.textContent = label;

      const barSpan = document.createElement('span');
      barSpan.className = 'time-bar';

      cell.appendChild(labelSpan);
      cell.appendChild(barSpan);
      timeGrid.appendChild(cell);
      slots.push(cell);
    }
  }

  /* ---------- なぞって（ドラッグ／スワイプ）時間帯を選択 ---------- */
  let isDragging = false;
  let dragValue = true; // ドラッグ開始セルの反対の状態にする

  function setSelected(cell, selected) {
    cell.classList.toggle('is-selected', selected);
  }

  function updateStatus() {
    const count = slots.filter(s => s.classList.contains('is-selected')).length;
    pickerStatus.textContent = count === 0 ? '未選択' : count + '件選択中';
  }

  function handleStart(cell) {
    isDragging = true;
    dragValue = !cell.classList.contains('is-selected');
    setSelected(cell, dragValue);
    updateStatus();
  }

  function handleEnter(cell) {
    if (!isDragging) return;
    setSelected(cell, dragValue);
    updateStatus();
  }

  slots.forEach(cell => {
    cell.addEventListener('mousedown', (e) => { e.preventDefault(); handleStart(cell); });
    cell.addEventListener('mouseenter', () => handleEnter(cell));
    cell.addEventListener('touchstart', (e) => { e.preventDefault(); handleStart(cell); }, { passive: false });
    cell.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      const el = document.elementFromPoint(touch.clientX, touch.clientY);
      const target = el && el.closest('.time-row');
      if (target) handleEnter(target);
    }, { passive: false });
  });

  document.addEventListener('mouseup', () => { isDragging = false; });
  document.addEventListener('touchend', () => { isDragging = false; });
  document.addEventListener('touchcancel', () => { isDragging = false; });
</script>

</body>
</html>
