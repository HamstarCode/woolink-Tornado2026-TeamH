<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Woolink</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="phone">

  <header class="topbar">
    <div class="brand">
      <p class="welcome-copy">ようこそ Woolinkへ！</p>
      <div class="brand-panel">
        <div class="brand-copy">
          <p> ①返事に焦らない交換日記</p><br>日記を書いたら、返事を待ち眠る。<br>ゆっくりやりとりができる交換日記で<br>日常の共有ができます。</p>
        </div>

         <img class="brand-name" src="picture/アプリアイコン1.svg" alt="Woolink">
        <div class="page-indicators" role="group" aria-label="ページ選択">
          <button class="page-indicator" type="button" aria-label="1ページ目" aria-pressed="false"></button>
          <button class="page-indicator is-active" type="button" aria-label="2ページ目" aria-pressed="true"></button>
          <button class="page-indicator" type="button" aria-label="3ページ目" aria-pressed="false"></button>
          <button class="page-indicator" type="button" aria-label="4ページ目" aria-pressed="false"></button>
        </div>
      </div>
      <a class="next-btn" href="placeholder.html?title=次へ">次へ</a>
    </div>
  </header>

</div>

</body>
</html>
