<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Woolink</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="phone">

  <header class="topbar">
    <div class="brand">
      <img class="brand-name" src="picture/woolinkロゴ.svg" alt="Woolink">
    </div>
    <button class="menu-btn" id="menuBtn" aria-label="メニューを開く" aria-expanded="false" aria-controls="menuPanel">
      <span></span><span></span><span></span>
    </button>
  </header>

  <nav class="menu-panel" id="menuPanel" hidden>
    <a class="menu-item" href="placeholder.html?title=プロフィール">
      <span>プロフィール</span><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="menu-item" href="placeholder.html?title=お知らせ">
      <span>お知らせ</span><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="menu-item" href="placeholder.html?title=設定">
      <span>設定</span><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="menu-item" href="placeholder.html?title=ヘルプ">
      <span>ヘルプ</span><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="menu-item" href="placeholder.html?title=ログアウト">
      <span>ログアウト</span><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </nav>

  <main class="content">
    <section class="friend-card">
      <h1>友達一覧</h1>
      <p>このあたりにもともと畑があって、友達ができると羊に変わるみたいなのできる？</p>
    </section>

    <section class="actions">
      <a class="action-tile diary" href="placeholder.html?title=交換日記">
        <span class="badge" id="diaryBadge" aria-hidden="true"></span>
        <svg class="tile-icon" viewBox="0 0 48 48" width="40" height="40" aria-hidden="true">
          <rect x="12" y="8" width="24" height="32" rx="3" fill="#fbfaf6"/>
          <rect x="9" y="10" width="24" height="32" rx="3" fill="#ffffff" stroke="#dcd8cc" stroke-width="1"/>
          <line x1="14" y1="17" x2="28" y2="17" stroke="#c9c4b4" stroke-width="1.4"/>
          <line x1="14" y1="22" x2="28" y2="22" stroke="#c9c4b4" stroke-width="1.4"/>
          <line x1="14" y1="27" x2="24" y2="27" stroke="#c9c4b4" stroke-width="1.4"/>
        </svg>
        <span class="tile-label">交換日記</span>
      </a>

      <a class="action-tile call is-disabled" aria-disabled="true" tabindex="-1">
        <svg class="tile-icon" viewBox="0 0 48 48" width="34" height="34" aria-hidden="true">
          <rect x="14" y="21" width="20" height="17" rx="3" fill="none" stroke="#fbfaf6" stroke-width="2.6"/>
          <path d="M18 21v-5a6 6 0 0 1 12 0v5" fill="none" stroke="#fbfaf6" stroke-width="2.6"/>
          <circle cx="24" cy="29" r="2.2" fill="#fbfaf6"/>
        </svg>
        <span class="tile-label">両思い通話</span>
      </a>
    </section>
  </main>

  <footer class="mascot-row">
    <img class="mascot" src="picture/ガイド羊.svg" alt="ガイド羊">
    <a class="guide-bubble" href="placeholder.html?title=ガイド">ガイド</a>
  </footer>

</div>

<script>
  // 交換日記に未読の更新がある場合だけ true にしてください（実データと連携する箇所）
  const hasDiaryNotification = false;
  const diaryBadge = document.getElementById('diaryBadge');
  if (hasDiaryNotification) {
    diaryBadge.classList.add('is-visible');
  }

  const menuBtn = document.getElementById('menuBtn');
  const menuPanel = document.getElementById('menuPanel');

  menuBtn.addEventListener('click', () => {
    const isOpen = !menuPanel.hidden;
    if (isOpen) {
      menuPanel.hidden = true;
      menuBtn.classList.remove('open');
      menuBtn.setAttribute('aria-expanded', 'false');
    } else {
      menuPanel.hidden = false;
      menuBtn.classList.add('open');
      menuBtn.setAttribute('aria-expanded', 'true');
    }
  });

  document.addEventListener('click', (e) => {
    if (!menuPanel.hidden && !menuPanel.contains(e.target) && !menuBtn.contains(e.target)) {
      menuPanel.hidden = true;
      menuBtn.classList.remove('open');
      menuBtn.setAttribute('aria-expanded', 'false');
    }
  });
</script>

</body>
</html>
