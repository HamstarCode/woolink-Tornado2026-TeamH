<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Woolink</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="phone">

  <header class="topbar">
    <div class="brand">
      <img class="brand-name" src="picture/woolinkロゴ.svg" alt="Woolink">
    </div>
  </header>

  <main class="placeholder-main">
    <div class="placeholder-icon">
      <svg viewBox="0 0 24 24" width="28" height="28"><path d="M12 3v18M3 12h18" stroke="#8a90ad" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
    </div>
    <h1 id="pageTitle">仮ページ</h1>
    <p>このページはまだ準備中です。ここに「<span id="pageTitle2">この機能</span>」の画面が入る予定です。</p>
    <button class="back-btn" id="backBtn">
      <svg viewBox="0 0 24 24" width="14" height="14"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      戻る
    </button>
  </main>

</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const title = params.get('title') || '仮ページ';
  document.title = 'Woolink | ' + title;
  document.getElementById('pageTitle').textContent = title;
  document.getElementById('pageTitle2').textContent = title;

  document.getElementById('backBtn').addEventListener('click', () => {
    if (window.history.length > 1) {
      window.history.back();
    } else {
      window.location.href = 'index.html';
    }
  });
</script>

</body>
</html>
